[package]
name = "symbiote"
version = "0.1.0"
description = "Symbiote v0 - Local-first chat UI"
authors = ["Antigravity"]
edition = "2021"

[lib]
name = "symbiote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
tauri = { version = "2.10.2", features = [] }
tauri-plugin-opener = "2.5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
jsonschema = "0.17"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "macros", "chrono", "uuid"] }
reqwest = { version = "0.11", features = ["json", "stream", "multipart"] }
base64 = "0.21"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
eventsource-stream = "0.2"
sqlite-vec = "0.1"

log = "0.4"
env_logger = "0.10"
url = "2.5"
regex = "1"
chrono-tz = "0.10.4"
once_cell = "1"
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
strsim = "0.11"
tiktoken-rs = "0.5"
num-complex = "0.4"

[dev-dependencies]
tauri = { version = "2.10.2", features = ["test"] }
